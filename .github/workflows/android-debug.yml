name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub's ubuntu-latest runner already includes an Android SDK.
      # Avoid setup-android's sdkmanager update, which fails on some runners.
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          java -version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile FOSS debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleFossDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rphone-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
